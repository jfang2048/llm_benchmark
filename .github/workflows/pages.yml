name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "results/final/**"
      - "results/v2/**"
      - "scripts/generate_report.py"
      - "scripts/generate_v2_report.py"
      - "scripts/curate_v2_final.py"
      - "requirements-report.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow only one deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report dependencies
        run: python3 -m pip install --quiet -r requirements-report.txt

      - name: Regenerate report artifacts
        run: python3 scripts/generate_report.py

      - name: Regenerate v2 report artifacts
        run: python3 scripts/generate_v2_report.py || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
